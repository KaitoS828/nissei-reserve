name: Supabase Keepalive

# 無料プランの自動一時停止（無操作が続くと停止）を防ぐため、
# 毎日、実クエリを1回投げてアクティビティを発生させる。
on:
  schedule:
    - cron: "17 2 * * *" # 毎日 02:17 UTC（=11:17 JST）
  workflow_dispatch: {} # 手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep project active
        env:
          SUPABASE_URL: https://eeltxyxknpezofrqvbgl.supabase.co
          # anon（公開）キー。NEXT_PUBLIC_ でブラウザに配布されるキーと同一で、
          # 秘匿情報ではない（アクセス制御は RLS が担保）。keepalive 専用途。
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlbHR4eXhrbnBlem9mcnF2YmdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODg0NTYsImV4cCI6MjA5NjA2NDQ1Nn0.mbKV9241ba2NwYNjnP5Kz77Qd7NK4B_BCBvKr5eA-8U
        run: |
          echo "Pinging Supabase REST API..."
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/plans?select=id&limit=1")
          echo "HTTP ${code}"
          head -c 300 /tmp/resp.txt; echo
          if [ "${code}" != "200" ]; then
            echo "::error::Supabase returned HTTP ${code} (expected 200). Project may be paused or misconfigured."
            exit 1
          fi
          echo "OK: project is active."
